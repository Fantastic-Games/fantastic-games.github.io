baseURL = 'https://www.fantastic-games.dev'
languageCode = 'en-us'
title = 'Fantastic Games'
theme = "mana"

[menus]
  [[menus.main]]
    identifier = "home"
    name = "Home"
    url = ""
    weight = 10

  [[menus.main]]
    identifier = "about"
    name = "About"
    url = "about"
    weight = 20

  [[menus.main]]
    identifier = "devlogs"
    name = "Devlogs"
    url = "posts"
    weight = 30

  [[menus.main]]
    identifier = "contact"
    name = "Contact Us"
    url = "contact"
    weight = 40 

  [[menus.main]]
    identifier = "games"
    name = "Our Games"
    url = "projects"

  [[menus.main]]
    identifier = "tba"
    name = "TBA"
    parent = "games"
    url = "tba"

[params]
  description = " We make games we want to play"
  footerText = "Built with love in Hugo and Mana theme"  # Optional

  # Hero section title (optional - defaults to site.Title)
  heroTitleLine1 = "Fantastic Games"  # First line of hero title
  # heroTitleLine2 = "Est. 2023"    # Second line of hero title (optional)

  heroImg = '/FantasticLogoTransparent.webp'

  missionStatement = "We are a team dedicated to making games WE would want to play, to express our own ideas and stories through the interactive medium of video games. We will never pursue a project for the sake of profitability, and we will never develop a project we do not want to make."
  antiAIStatement = "We at Fantastic Games are strongly against the usage of generative AI. We will NOT condone the usage of generative AI in ANY level of development. We pride ourselves that our work is 100% human made and will not take away the natural creativity this team has. "

  [params.favicons]
    png = '/favicon/favicon.ico'

  [params.social]
    github = "https://github.com/Fantastic-Games/Fantastic-Games.github.io"
    linkedin = "https://www.linkedin.com/company/fantastic-games-studios/"
    twitter = "FntsticGamesDev"
    tiktok = "https://www.tiktok.com/@fantasticgamesdev"
    youtube = "https://www.youtube.com/@FantasticGamesDev"
    instagram = "https://www.instagram.com/fantasticgamesdev/"
    # email = "your.email@example.com"
  

[caches]
  [caches.images]
    dir = ':cacheDir/images'